<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        table {
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid gray;
            padding: 1px;
        }

    </style>

    <title>tabela</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Geral</th>
                <th>Nomes</th>
                <th colspan="3">Filmes</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="2">Mulheres</th>
                <td>Ana Maria</td>
                <td>Tartarugas Ninja</td>
                <td>Mermeid</td>
                <td>Procurando o Nemo</td>
            </tr>
            <tr>
                <td>Izabella</td>
                <td>Carros</td>
                <td>Clube da Luta</td>
                <td>Interinstelar</td>
            </tr>
            <tr>
                <th rowspan="2">Homens</th>
                <td>João</td>
                <td>Taxy Driver</td>
                <td>Homen Aranha</td>
                <td>Vingadores</td>
            </tr>
            <tr>
                <td>Marcos Aurélho</td>
                <td>Rio</td>
                <td>Wall-E</td>
                <td>Ratatouille</td>
            </tr>
        </tbody>

    </table>
</body>
</html>
