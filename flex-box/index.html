<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
div#container{
    
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px dashed black;
    gap: 10px;
}
div#container > *{
    border: 1px dashed blue;
}

iframe {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
}

    </style>
</head>
<body>
    <main>
        <div id="container">
            <div class="box-texto">
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusantium necessitatibus, repudiandae perspiciatis quae ea architecto sunt.</p>
            </div>

                <iframe src="https://www.youtube.com/embed/Km71Rr9K-Bw?si=wdmLVCvluxMt0KPt" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </main>
</body>
</html>
